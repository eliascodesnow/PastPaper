version: '3.8'

services:
  backend:
    build: .
    image: pastpaper-backend:latest
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment}
      - SQLITE_DB_PATH=/app/dev.db
      - PORT=4000
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
