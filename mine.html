<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My uploads — The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">FA</span> The Archive</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<section class="section">
  <div class="wrap">
    <div class="eyebrow-line">Your record</div>
    <h1>My uploads</h1>
    <p class="page-intro">Everything you've submitted, and what the screening pipeline decided.</p>
    <div class="ledger" id="ledger">
      <div class="ledger-empty">Loading…</div>
    </div>
  </div>
</section>

<script src="api.js"></script>
<script>
renderNav("mine.html");
if (!Auth.isLoggedIn()) window.location.href = "login.html";

function stampFor(status) {
  if (status === "APPROVED") return `<span class="tag tag-verified">verified</span>`;
  if (status === "REJECTED") return `<span class="tag tag-rejected">rejected</span>`;
  return `<span class="tag">pending</span>`;
}

async function loadMine() {
  const el = document.getElementById("ledger");
  try {
    const papers = await api("/papers/mine");
    if (!papers.length) {
      el.innerHTML = `<div class="ledger-empty">Nothing yet — <a href="upload.html" class="upload-link">upload your first paper</a>.</div>`;
      return;
    }
    el.innerHTML = papers.map(p => `
      <div class="ledger-row">
        <div class="ledger-title">
          ${escapeHtml(p.title)}
          <span class="unit">${escapeHtml(p.unitName || "")} ${p.unitCode ? "· " + escapeHtml(p.unitCode) : ""}${p.rejectionReason ? " — " + escapeHtml(p.rejectionReason) : ""}</span>
        </div>
        <span class="tag">${escapeHtml(p.examType)}</span>
        <span class="tag tag-year">${p.year}</span>
        ${stampFor(p.status)}
        <span></span>
      </div>
    `).join("");
  } catch (err) {
    el.innerHTML = `<div class="ledger-empty">Couldn't load your uploads.</div>`;
  }
}
loadMine();
</script>
</body>
</html>
