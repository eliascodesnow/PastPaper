<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upload a paper — The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">FA</span> The Archive</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<main class="auth-shell upload-shell">
  <div class="upload-intro">
    <span class="contribute-label">Contribute</span>
    <h1 class="upload-heading">Upload a past paper</h1>
    <p>Your upload stays private until it has been reviewed by an administrator.</p>
  </div>

  <div class="form-panel">
    <div id="alert-box"></div>
    <form id="upload-form">
      <label for="title">Title</label>
      <input id="title" placeholder="e.g. Data Structures Main Exam 2025" required />

      <label for="unitName">Unit name</label>
      <input id="unitName" placeholder="e.g. Data Structures and Algorithms" />

      <label for="unitCode">Unit code</label>
      <input id="unitCode" placeholder="e.g. BIT 2103" />

      <div class="upload-fields-grid">
        <div>
          <label for="examType">Exam type</label>
          <select id="examType">
            <option value="">Let the system guess</option>
            <option>CAT</option>
            <option>Main Exam</option>
            <option>Supplementary</option>
            <option>Assignment</option>
          </select>
        </div>
        <div>
          <label for="year">Year</label>
          <input id="year" type="number" min="2015" max="2027" placeholder="2026" />
        </div>
      </div>

      <label for="fileInput">File</label>
      <div class="dropzone" id="dropzone">
        <div>Drop a PDF, JPG, or PNG here, or click to choose one</div>
        <div class="filename" id="filename"></div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp" class="visually-hidden" />

      <button class="btn btn-primary btn-block upload-submit" type="submit" id="submit-btn">Submit for review</button>
    </form>

    <div id="upload-result"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script>
supabaseReady.then(async () => {
  await renderNav("upload.html");
  if (!Auth.isLoggedIn()) {
    const panel = document.querySelector('.form-panel');
    const note = document.createElement('div');
    note.className = 'alert alert-info';
    note.textContent = 'Log in to submit a paper.';
    panel.insertBefore(note, panel.firstChild);
  }
}).catch((error) => {
  const alert = document.createElement("div");
  alert.className = "alert alert-err";
  alert.textContent = error.message;
  document.getElementById("alert-box").appendChild(alert);
});
// Allow selecting a file while logged out — require login only to submit.
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const filenameEl = document.getElementById("filename");
let selectedFile = null;

dropzone.addEventListener("click", () => fileInput.click());
["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", (e) => {
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(file) {
  if (file.size > 20 * 1024 * 1024) {
    selectedFile = null;
    filenameEl.textContent = "Files must be 20 MB or smaller.";
    return;
  }
  if (!["application/pdf", "image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    selectedFile = null;
    filenameEl.textContent = "Choose a PDF, JPG, PNG, or WEBP file.";
    return;
  }
  selectedFile = file;
  filenameEl.textContent = `${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
}

function renderUploadResult(paper) {
  const result = document.getElementById("upload-result");
  result.textContent = "";
  const message = document.createElement("div");
  message.className = "alert alert-ok upload-confirmation";
  message.textContent = `“${paper.title}” was submitted and is waiting for review.`;
  result.appendChild(message);
}

document.getElementById("upload-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const alertBox = document.getElementById("alert-box");
  alertBox.innerHTML = "";
  document.getElementById("upload-result").textContent = "";

  try {
    await supabaseReady;
  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.className = "alert alert-err";
    return;
  }
  if (!Auth.isLoggedIn()) {
    alertBox.textContent = "Log in before submitting. Your selected file will remain on this page.";
    alertBox.className = "alert alert-err";
    return;
  }

  if (!selectedFile) {
    alertBox.textContent = "Choose a valid file first.";
    alertBox.className = "alert alert-err";
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Uploading…";

  const form = new FormData();
  form.append("title", document.getElementById("title").value);
  form.append("unitName", document.getElementById("unitName").value);
  form.append("unitCode", document.getElementById("unitCode").value);
  if (document.getElementById("examType").value) form.append("examType", document.getElementById("examType").value);
  if (document.getElementById("year").value) form.append("year", document.getElementById("year").value);
  form.append("file", selectedFile);

  try {
    const result = await api("/papers", { method: "POST", body: form });
    renderUploadResult(result.paper);
    document.getElementById("upload-form").reset();
    selectedFile = null;
    filenameEl.textContent = "";
  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.className = "alert alert-err";
  } finally {
    btn.disabled = false;
    btn.textContent = "Submit for review";
  }
});
</script>
</body>
</html>
