<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Register — The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">FA</span> The Archive</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<main class="auth-shell">
  <div class="register-intro">
    <span class="eyebrow register-eyebrow">Join the archive</span>
    <h1 class="register-title">Create your account</h1>
    <p>Use your email to save uploads and contribute papers.</p>
  </div>

  <div class="form-panel">
    <div id="alert-box"></div>
    <form id="register-form">
      <label for="name">Full name</label>
      <input id="name" placeholder="Your name" required autocomplete="name" />

      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />

      <button class="btn btn-primary btn-block register-submit" id="register-submit" type="submit">Create account</button>
    </form>
    <div class="form-foot">Already registered? <a class="register-login-link" href="login.html">Log in</a></div>
  </div>
</main>

<script src="js/api.js"></script>
<script>
(async () => {
  await supabaseReady;
  await renderNav("register.html");
  if (Auth.isLoggedIn()) window.location.replace("index.html");

  const form = document.getElementById("register-form");
  const alertBox = document.getElementById("alert-box");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    alertBox.textContent = "";
    const button = document.getElementById("register-submit");
    button.disabled = true;
    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        options: { data: { full_name: document.getElementById("name").value.trim() } },
      });
      if (error) throw error;
      const notice = document.createElement("div");
      notice.className = "alert alert-ok";
      notice.textContent = data.session
        ? "Your account is ready. You can now contribute papers."
        : "Check your email to confirm your account, then log in.";
      alertBox.appendChild(notice);
      if (data.session) window.location.replace("index.html");
    } catch (error) {
      const notice = document.createElement("div");
      notice.className = "alert alert-err";
      notice.textContent = error.message;
      alertBox.appendChild(notice);
    } finally {
      button.disabled = false;
    }
  });
})().catch((error) => {
  const alert = document.createElement("div");
  alert.className = "alert alert-err";
  alert.textContent = error.message;
  document.getElementById("alert-box").appendChild(alert);
});
</script>
</body>
</html>
