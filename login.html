<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">FA</span> The Archive</a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<main class="auth-shell">
  <div class="auth-heading">
    <span class="auth-kicker">Welcome back</span>
    <h1 class="auth-title">Log in</h1>
  </div>

  <div class="form-panel">
    <div id="alert-box"></div>
    <form id="login-form">
      <label for="regNumber">Registration number</label>
      <input id="regNumber" class="reg-input" placeholder="DSE-01-0419/2025" required autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" />

      <button class="btn btn-primary btn-block auth-submit" type="submit">Log in</button>
    </form>
    <div class="form-foot">New here? <a href="register.html">Register</a></div>
  </div>
</main>

<script src="js/api.js"></script>
<script>
renderNav("login.html");
if (Auth.isLoggedIn()) window.location.href = "index.html";

document.getElementById("regNumber").addEventListener("input", (e) => e.target.value = e.target.value.toUpperCase());

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("alert-box");
  alertBox.innerHTML = "";
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({
        regNumber: document.getElementById("regNumber").value,
        password: document.getElementById("password").value,
      }),
    });
    Auth.setSession(data.token, data.user);
    window.location.href = "index.html";
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-err">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
